name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar repositório
      uses: actions/checkout@v4

    - name: Extrair ZIP automaticamente se enviado pelo celular
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          echo "Arquivo ZIP detectado! Descompactando..."
          unzip -o *.zip
        fi
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            echo "Movendo arquivos da subpasta $SUBDIR para a raiz..."
            cp -r $SUBDIR/* .
          fi
        fi

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle na Nuvem
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Aceitar Licenças Android
      run: |
        yes | sdkmanager --licenses || true

    - name: Compilar APK
      run: |
        chmod +x gradlew 2>/dev/null || true
        gradle assembleDebug --stacktrace --no-daemon

    - name: Salvar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: dburger-gestao-apk
        path: app/build/outputs/apk/debug/*.apk
